name: Atualizar concursos e noticias

on:
  schedule:
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolher dados
        run: python collector.py
      - name: Guardar resultados
        run: |
          git config user.name "efc-bot"
          git config user.email "efc-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Atualizacao automatica" && git push)
