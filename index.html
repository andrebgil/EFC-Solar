<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EFC Solar | Controlo de Obras e Horas</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F1E33"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--card:#fff;--ink:#0F1E33;--mut:#5B6B80;--line:#D5DDE6;--sun:#E8A200;--blue:#0B5FA5;--ok:#1B8A5A;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1522;--card:#142238;--ink:#E8EEF5;--mut:#93A3B8;--line:#243652;--blue:#5AA9E6}}
:root[data-theme="dark"]{--bg:#0C1522;--card:#142238;--ink:#E8EEF5;--mut:#93A3B8;--line:#243652;--blue:#5AA9E6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Schibsted Grotesk',system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:4px solid var(--sun)}
header b{font-weight:800;font-size:17px}header small{opacity:.75;display:block}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 0;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mut);padding:9px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--sun)}
main{padding:16px;max-width:1200px;margin:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
h2{margin:0;font-size:20px;font-weight:800}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.s{background:none;color:var(--blue);border:1px solid var(--line);padding:5px 9px;font-size:13px}
.btn.d{color:var(--bad)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;background:var(--bg)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kp span{color:var(--mut);font-size:13px}.kp b{display:block;font-size:26px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{margin:0 0 4px;font-size:16px}.mut{color:var(--mut);font-size:13px}
.pb{height:8px;background:var(--line);border-radius:4px;margin:8px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--sun)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:9}
.md{background:var(--card);border-radius:10px;padding:18px;width:100%;max-width:520px}
.md label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.md input,.md select,.md textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.md .ck{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--ink)}.md .ck input{width:auto}
.md .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#off{display:none;background:var(--sun);color:#000;text-align:center;padding:6px;font-size:13px}
.msg{max-width:480px;margin:60px auto;text-align:center;padding:20px}

.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:#0B1424;color:#C9D4E3;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff}
.brand b{font-weight:800;font-size:16px;line-height:1.1}.brand small{display:block;color:#8FA1BA;font-weight:400;font-size:11px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#C9D4E3;padding:9px 10px;margin:1px 0;border-radius:8px;font:600 14px inherit;font-family:inherit;cursor:pointer;text-align:left}
.nv:hover{background:#14233B}.nv.on{background:#1B3358;color:#fff;box-shadow:inset 3px 0 0 var(--sun)}.nv svg{width:18px;height:18px;flex:none}
.nv em{margin-left:auto;background:var(--sun);color:#0B1424;border-radius:10px;font-style:normal;font-size:11px;padding:1px 7px;font-weight:700}
.sp{flex:1;min-height:12px}.usr{border-top:1px solid #1B2B45;padding:12px 8px 0;display:flex;gap:10px;align-items:center}
.usr small{color:#8FA1BA}.av{width:34px;height:34px;border-radius:50%;background:#1B3358;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.side .btn.s{color:#C9D4E3;border-color:#243652;flex:1}
.cont{flex:1;min-width:0}main{max-width:1400px;margin:0 auto;padding:20px 24px}
.mtop,.ovl{display:none}
.dg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.kc span{color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.kc b{display:block;font-size:28px;font-weight:800;margin:2px 0}.kc small{color:var(--ok);font-size:12px}.kc svg{width:100%;height:34px;margin-top:6px;display:block}
.dm{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:start}.dm>div{display:grid;gap:12px;min-width:0}
.pn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.pn h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between}.pn h3 span{color:var(--mut);font-weight:400;font-size:12px}
.br{margin:9px 0}.br div{display:flex;justify-content:space-between;font-size:13px;gap:8px}.br i{display:block;height:6px;background:var(--line);border-radius:3px;margin-top:4px}.br u{display:block;height:100%;background:var(--blue);border-radius:3px}
.ac{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.ac:last-child{border:0}.ac i{width:8px;height:8px;border-radius:50%;background:var(--sun);margin-top:6px;flex:none}.ac small{display:block;color:var(--mut)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:4px}.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media(max-width:1200px){.dg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
@media(max-width:900px){.dm{grid-template-columns:1fr}.side{position:fixed;left:-260px;z-index:20;transition:left .2s;width:240px}.side.open{left:0}
 .mtop{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0B1424;color:#fff;border-bottom:3px solid var(--sun)}.mtop .btn.s{color:#fff;border-color:#243652}
 .ovl.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}main{padding:14px}}
</style>
</head>
<body>
<div id="app"><div class="msg">A carregar…</div></div>
<script>
const ROLES={ceo:'CEO',admin:'Administrador',comercial:'Comercial',logistica:'Logística',financas:'Finanças',tecnico:'Técnico'};
const ST=['Planeada','Em Curso','Terminada','Pendente','Paralisada'];
const PST=['Enviada','Em negociação','Adjudicada','Perdida'];
const PROVS=['Maputo Cidade','Maputo Província','Gaza','Inhambane','Sofala','Manica','Tete','Zambézia','Nampula','Cabo Delgado','Niassa'];
const PCAT=['Obras','Equipamentos/Produtos','Marketing','Patrocínio'];
const PFX={'Obras':'OBR','Equipamentos/Produtos':'EQP','Marketing':'MKT','Patrocínio':'PAT'};
const REQ={projects:['client'],materials:['code','item'],progress:['code','act'],hours:['code'],proposals:['client','name','prov','city']};
const MST=['Pendente','Parcial','Disponível','Encomendado','Recebido'];
const COLS=['clients','reqs','projects','hours','progress','materials','roles','members','rates','proposals','finance','log'];
const S={me:null,uid:null,admin:false,d:{},names:{},tab:null,db:null,user:null,f:{}};
COLS.forEach(c=>S.d[c]=[]);
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(a[x]==null)continue;x=='class'?e.className=a[x]:x.startsWith('on')?e[x]=a[x]:e.setAttribute(x,a[x])}k.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c??'')));return e};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('pt-PT');
const role=()=>S.admin?'admin':(S.d.roles.find(r=>r.id==S.uid)||{}).role;
const rate=u=>+((S.d.rates.find(r=>r.id==u)||{}).v||0);
const nm=u=>S.names[u]||'Utilizador';
const pName=c=>{const p=S.d.projects.find(x=>x.code==c);return p?p.code+' · '+p.client:c||''};
const tmin=t=>{if(!t)return 0;const[a,b]=t.split(':');return +a*60+ +b};
const calc=h=>{const tot=Math.max(0,(tmin(h.out)-tmin(h.in)-(+h.brk||0))/60);return{tot,nor:Math.min(8,tot),ext:Math.max(0,tot-8),cost:tot*rate(h.uid)}};
const mine=p=>(p.techs||[]).includes(S.uid);
const seeCost=()=>['admin','financas','ceo'].includes(role());

const ENT={
projects:{t:'Projectos',edit:['admin','comercial'],f:[['code','Código da obra (vazio = gerar a partir das siglas)'],['client','Cliente'],['name','Projecto / Obra'],['cat','Tipo de projecto','sel',PCAT],['prov','Província','sel',PROVS],['city','Cidade / Distrito'],['csig','Sigla do cliente (ex.: IGR, CM)'],['lsig','Sigla do local (ex.: BR, SL)'],['loc','Local / Morada'],['kw','Potência PV (kW)','number'],['bat','Baterias (kWh)','number'],['inv','Potência do inversor (kW)','number'],['type','Tipo de sistema','sel',['On-Grid','Híbrido','Off-Grid','ESS','Outro']],['resp','Responsável'],['start','Data início','date'],['due','Data prevista','date'],['state','Estado','sel',ST],['pct','% Execução','number'],['value','Valor de venda ao cliente (MT)','number'],['matcost','Custo de materiais com o fornecedor (MT)','number'],['techs','Técnicos atribuídos','techs'],['obs','Observações','area']]},
materials:{t:'Materiais & Pendências',edit:['admin','logistica'],f:[['code','Projecto','proj'],['item','Item / Material'],['need','Qtd. necessária','number'],['have','Qtd. disponível','number'],['state','Estado','sel',MST],['resp','Responsável'],['date','Data necessária','date'],['sup','Fornecedor / Origem'],['obs','Observações','area']]},
progress:{t:'Progresso',edit:['admin','tecnico'],f:[['date','Data','date'],['code','Projecto','proj'],['act','Actividade'],['pct','% Concluído','number'],['issue','Pendência / Problema','area'],['fix','Acção correctiva'],['due','Data prevista','date'],['photo','Foto (opcional)','photo']]},
hours:{t:'Horas Técnicos',edit:['admin','tecnico'],f:[['date','Data','date'],['code','Projecto','proj'],['in','Hora entrada','time'],['out','Hora saída','time'],['brk','Pausa (min)','number'],['act','Actividade executada','area'],['obs','Observações']]},
proposals:{t:'Propostas',edit:['admin','comercial'],f:[['date','Data','date'],['client','Cliente'],['name','Proposta / Obra'],['cat','Tipo','sel',['Obras','Equipamentos/Produtos']],['prov','Província *','sel',PROVS],['city','Cidade / Distrito *'],['csig','Sigla do cliente (ex.: IGR) — obrigatória para adjudicar'],['lsig','Sigla do local (ex.: BR) — sugerida a partir da cidade'],['kw','Potência PV (kW)','number'],['bat','Baterias (kWh)','number'],['inv','Potência do inversor (kW)','number'],['value','Valor (MT)','number'],['state','Estado','sel',PST],['resp','Responsável'],['obs','Observações','area']]},
finance:{t:'Finanças da obra',edit:['admin','financas'],f:[['billed','Facturado ao cliente (MT)','number'],['received','Recebido do cliente (MT)','number']]}
};
const COL={
projects:p=>[p.code,p.client,p.name,p.cat||'Obras',[p.city,p.prov].filter(Boolean).join(', '),p.kw,p.bat,p.inv,p.state,(p.pct||0)+'%',p.due,...(seeCost()?(isMkt(p)?['—','—']:(x=>[fmt(x.bil),fmt(x.lu)])(profitOf(p))):[])],
materials:m=>[m.date,pName(m.code),m.item,m.need,m.have,Math.max(0,(+m.need||0)-(+m.have||0)),$('span',{class:'tag'},m.state),m.sup],
progress:p=>[p.date,pName(p.code),p.act,(p.pct||0)+'%',p.issue,p.fix,p.due,p.photo?$('img',{src:p.photo,style:'height:34px;border-radius:4px;cursor:pointer',onclick:()=>photoView(p.photo)}):''],
proposals:p=>[p.date,p.client,p.name,p.cat||'Obras',[p.city,p.prov].filter(Boolean).join(', '),p.kw,p.bat,p.inv,fmt(p.value||0)+' MT',$('span',{class:'tag'},p.state),p.resp],
hours:h=>{const c=calc(h);const r=[h.date,nm(h.uid),pName(h.code),h.in+'–'+h.out,fmt(c.nor),fmt(c.ext),h.act,$('span',{class:'tag '+(h.ok?'ok':'')},h.ok?'Aprovado':'Por aprovar')];if(seeCost())r.splice(6,0,fmt(c.cost)+' MT');return r}
};
const HEAD={
projects:['Código','Cliente','Obra','Tipo','Local','kW PV','kWh','Inversor kW','Estado','Exec.','Prevista'],
materials:['Data','Projecto','Item','Necess.','Disp.','Em falta','Estado','Fornecedor'],
progress:['Data','Projecto','Actividade','%','Pendência','Acção','Prevista','Foto'],
proposals:['Data','Cliente','Proposta','Tipo','Local','kW PV','kWh','Inversor kW','Valor','Estado','Responsável'],
hours:['Data','Técnico','Projecto','Horário','Normais','Extra','Actividade','Estado']
};

function visible(k){
  let a=S.d[k];const r=role();
  if(r!='tecnico')return a;
  const codes=S.d.projects.filter(mine).map(p=>p.code);
  if(k=='projects')return a.filter(mine);
  if(k=='hours')return a.filter(h=>h.uid==S.uid);
  return a.filter(x=>codes.includes(x.code));
}
function canEdit(k,doc){
  const r=role();if(!ENT[k].edit.includes(r))return false;
  if(k=='hours'&&r=='tecnico')return doc?doc.uid==S.uid&&!doc.ok:true;
  return true;
}

function modal(k,doc,pre){
  const E=ENT[k],o={...(doc||{}),...(pre||{})},inputs={};
  const body=$('div');
  E.f.forEach(([key,lab,type,opts])=>{
    body.append($('label',{},lab));
    let el;
    if(type=='sel')el=$('select',{},$('option',{value:''},'—'),opts.concat(o[key]&&!opts.includes(o[key])?[o[key]]:[]).map(v=>$('option',{value:v},v)));
    else if(type=='proj')el=$('select',{},$('option',{value:''},'—'),S.d.projects.filter(p=>role()!='tecnico'||mine(p)).map(p=>$('option',{value:p.code},p.code+' · '+p.client)));
    else if(type=='photo'){el=$('input',{type:'file',accept:'image/*'});inputs[key]=el;body.append(el);if(o[key])body.append($('div',{class:'mut'},'Já existe uma foto; escolher outra substitui-a.'));return}
    else if(type=='area')el=$('textarea',{rows:2});
    else if(type=='techs'){
      el=$('div');const ts=S.d.roles.filter(r=>r.role=='tecnico');
      if(!ts.length)el.append($('span',{class:'mut'},'Ainda não há técnicos aprovados (separador Equipa).'));
      ts.forEach(t=>el.append($('label',{class:'ck'},$('input',{type:'checkbox',value:t.id,checked:(o.techs||[]).includes(t.id)?'':null}),nm(t.id))));
      inputs[key]=el;body.append(el);return;
    }else el=$('input',{type:type||'text'});
    if(type!='techs')el.value=o[key]??(key=='date'&&k!='materials'?new Date().toISOString().slice(0,10):'');
    inputs[key]=el;body.append(el);
  });
  if(k=='proposals'||k=='projects'){const cl=inputs.client,cs=inputs.csig,ct=inputs.city,ls=inputs.lsig;
    const fillC=()=>{const c=S.d.clients.find(x=>x.id==slug(cl.value));if(c&&!cs.value)cs.value=c.code};
    cl.addEventListener('change',fillC);ct.addEventListener('change',()=>{if(!ls.value)ls.value=locSig(ct.value)});fillC()}
  const close=()=>ov.remove();
  const save=async()=>{
    E.f.forEach(([key,,type])=>{
      if(type=='photo')return;
      if(type=='techs')o[key]=[...inputs[key].querySelectorAll('input:checked')].map(i=>i.value);
      else o[key]=type=='number'?+inputs[key].value||0:inputs[key].value;
    });
    if(k=='hours'){if(!o.in||!o.out)return alert('Indique hora de entrada e saída.');if(!doc){o.uid=S.uid;o.ok=false}}
    if(k=='proposals'||k=='projects'){o.csig=sigOf(o.csig);o.lsig=sigOf(o.lsig)}
    if(k=='projects'&&!o.code){if(!(o.csig&&o.lsig))return alert('Indique o código da obra ou as siglas do cliente e do local.');o.code=makeCode(o.csig,o.lsig)}
    if(k=='proposals'&&o.state=='Adjudicada'&&!o.projId&&!(o.csig&&o.lsig))return alert('Para adjudicar, indique a sigla do cliente e a do local: o código da obra é criado a partir delas.');
    const cf=(o.csig&&o.client)?S.d.clients.find(c=>c.code==o.csig&&c.id!=slug(o.client)):null;if(cf)return alert('A sigla '+o.csig+' já pertence ao cliente "'+cf.name+'". Cada cliente tem a sua sigla.');
    if((REQ[k]||[]).some(x=>!o[x]))return alert('Preencha os campos obrigatórios.');
    if(k=='hours'&&tmin(o.out)<=tmin(o.in))return alert('A hora de saída tem de ser depois da entrada.');
    try{const pf=inputs.photo&&inputs.photo.files[0];if(pf)o.photo=await shrink(pf);
      const ref=doc?S.db.collection(k).doc(doc.id):S.db.collection(k).doc();const w=ref.set(o);if(navigator.onLine)await w;else w.catch(()=>{});log(doc?'editou':'criou',k,o);if((k=='proposals'||k=='projects')&&o.csig&&o.client)S.db.collection('clients').doc(slug(o.client)).set({name:o.client,code:o.csig});if(k=='proposals'&&o.state=='Adjudicada'&&!o.projId&&navigator.onLine)await autoProject(o,ref.id);close()}
    catch(e){alert('Não foi possível guardar: '+(e.message||e.code))}
  };
  const ov=$('div',{class:'ov'},$('div',{class:'md'},$('h2',{},(doc?'Editar · ':'Novo · ')+E.t),body,
    $('div',{class:'act'},$('button',{class:'btn s',onclick:close},'Cancelar'),$('button',{class:'btn',onclick:save},'Guardar'))));
  document.body.append(ov);
}

const dl=(b,n)=>{const a=$('a',{href:URL.createObjectURL(b),download:n});document.body.append(a);a.click();a.remove()};
const csv=(head,rows,name)=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl(new Blob(['\ufeff'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv'}),name+'.csv')};
const txt=c=>c instanceof Node?c.textContent:String(c??'');
const log=(act,k,o)=>S.db.collection('log').add({t:Date.now(),uid:S.uid,act,k,ref:(o&&(o.code||o.item||o.client||o.act||o.name))||''}).catch(()=>{});
const shrink=f=>new Promise((res,rej)=>{const i=new Image,r=new FileReader;r.onload=()=>{i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
const photoView=src=>{const o=$('div',{class:'ov',onclick:()=>o.remove()},$('img',{src,style:'max-width:100%;max-height:90vh;margin:auto;border-radius:8px'}));document.body.append(o)};
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const sigOf=s=>String(s||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
const locSig=c=>{const t=norm(c).replace(/[^a-z]/g,''),v=t.replace(/[aeiou]/g,'');return(v.length>=2?v:t).slice(0,2).toUpperCase()};
const makeCode=(c,l)=>{const pre=sigOf(c)+'.'+sigOf(l)+'.',suf='.'+new Date().getFullYear();

function alerts(){

  S.d.projects.filter(p=>p.due&&p.due<t&&p.state!='Terminada').forEach(p=>L.push(['Obra atrasada',p.code+' · '+p.client+' — prevista para '+p.due]));
  S.d.materials.filter(m=>(+m.need||0)>(+m.have||0)&&m.date&&m.date<=D(7)).forEach(m=>L.push(['Material em falta',pName(m.code)+' — '+m.item+' (faltam '+((+m.need||0)-(+m.have||0))+', necessário até '+m.date+')']));
  const hp=S.d.hours.filter(h=>!h.ok&&h.date&&h.date<D(-3)).length;
  if(hp&&seeCost())L.push(['Horas por aprovar',hp+' registo(s) com mais de 3 dias']);
  S.d.proposals.filter(p=>p.state=='Enviada'&&p.date&&p.date<D(-15)).forEach(p=>L.push(['Proposta sem resposta',p.client+' · '+p.name+' — enviada em '+p.date]));
  const rp=S.d.reqs.filter(r=>r.status=='Pendente'&&Date.now()-(r.created||0)>2*864e5&&isApprover()&&r.uid!=S.uid).length;
  if(rp)L.push(['Requisições por aprovar',rp+' requisição(ões) pendente(s) há mais de 2 dias']);
  const rf=S.d.reqs.filter(r=>r.status=='Aprovada').length;
  if(rf&&(role()=='financas'||S.admin))L.push(['Requisições por pagar',rf+' requisição(ões) aprovada(s) à espera de pagamento']);
  return L;
}
